[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novelty-extraction"
version = "0.1.0"
description = "An experimental reference implementation of budgeted selective learning for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Novelty Extraction contributors"}]
keywords = ["selective-learning", "agent-memory", "novelty", "metareasoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
novelty-extraction = "novelty_extraction.cli:main"

[tool.setuptools.packages.find]
include = ["novelty_extraction*"]
